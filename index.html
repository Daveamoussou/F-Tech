<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F Tech Design — Commande</title>
<style>
  :root{
    --bg: #0b0f1a;
    --bg-card: #131a2b;
    --border: #22304a;
    --accent: #29b6f6;
    --accent-dark: #0288d1;
    --text: #e8edf5;
    --text-dim: #8b98af;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:60px;
  }
  header{
    width:100%;
    max-width:640px;
    display:flex;
    align-items:center;
    gap:16px;
    padding:28px 20px 20px;
  }
  .logo{
    width:56px;height:56px;
    border:2px solid var(--accent);
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:26px;color:var(--accent);
    flex-shrink:0;
  }
  header h1{
    font-size:22px;
    letter-spacing:1px;
  }
  header p{
    color:var(--text-dim);
    font-size:13px;
    margin-top:2px;
  }
  main{
    width:100%;
    max-width:640px;
    padding:0 20px;
  }
  .intro{
    color:var(--text-dim);
    font-size:17px;
    line-height:1.5;
    margin-bottom:28px;
  }
  .field{
    margin-bottom:22px;
  }
  label{
    display:block;
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  input, select, textarea{
    width:100%;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    color:var(--text);
    font-size:16px;
    outline:none;
    transition:border-color .15s;
    font-family:inherit;
  }
  input::placeholder, textarea::placeholder{color:#5c6a82;}
  input:focus, select:focus, textarea:focus{
    border-color:var(--accent);
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%238b98af' viewBox='0 0 16 16'><path d='M8 11L3 6h10z'/></svg>");
    background-repeat:no-repeat;
    background-position:right 16px center;
  }
  optgroup{color:var(--accent);font-weight:600;}
  option{color:#0b0f1a;}
  textarea{resize:vertical;min-height:70px;}
  .error{
    color:#ff6b6b;
    font-size:13px;
    margin-top:6px;
    display:none;
  }
  .field.invalid input, .field.invalid select{
    border-color:#ff6b6b;
  }
  .field.invalid .error{display:block;}
  button{
    width:100%;
    background:var(--accent);
    color:#06121f;
    border:none;
    border-radius:999px;
    padding:16px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    margin-top:12px;
    transition:background .15s, transform .1s;
  }
  button:hover{background:var(--accent-dark);}
  button:active{transform:scale(0.98);}
  .status{
    text-align:center;
    font-size:13px;
    color:var(--text-dim);
    margin-top:14px;
    min-height:18px;
  }
  footer{
    color:var(--text-dim);
    font-size:12px;
    margin-top:40px;
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <div class="logo">F</div>
  <div>
    <h1>TECH DESIGN</h1>
    <p>Qualité avant tout</p>
  </div>
</header>

<main>
  <p class="intro">Dites-moi ce qu'il vous faut, je réponds vite.</p>

  <form id="orderForm" novalidate>

    <div class="field" id="field-nom">
      <label for="nom">Nom</label>
      <input type="text" id="nom" placeholder="Votre nom" autocomplete="name">
      <div class="error">Merci d'indiquer votre nom.</div>
    </div>

    <div class="field" id="field-tel">
      <label for="tel">Téléphone</label>
      <input type="tel" id="tel" placeholder="Votre numéro" autocomplete="tel">
      <div class="error">Merci d'indiquer votre numéro.</div>
    </div>

    <div class="field" id="field-produit">
      <label for="produit">Produit souhaité</label>
      <select id="produit">
        <optgroup label="Boîtiers PC">
          <option value="Boîtier PC — 5000 FCFA">Boîtier PC — 5000 FCFA</option>
        </optgroup>
        <optgroup label="Clés USB">
          <option value="Clé USB 8GB">Clé USB 8GB</option>
          <option value="Clé USB 16GB">Clé USB 16GB</option>
          <option value="Clé USB 32GB">Clé USB 32GB</option>
          <option value="Clé USB 64GB">Clé USB 64GB</option>
          <option value="Clé USB 128GB">Clé USB 128GB</option>
        </optgroup>
        <optgroup label="Autre">
          <option value="Autre demande (préciser dans le message)">Autre demande (préciser dans le message)</option>
        </optgroup>
      </select>
    </div>

    <div class="field" id="field-adresse">
      <label for="adresse">Adresse de livraison</label>
      <input type="text" id="adresse" placeholder="Quartier, ville" autocomplete="street-address">
    </div>

    <div class="field" id="field-message">
      <label for="message">Message (optionnel)</label>
      <textarea id="message" placeholder="Précisions sur votre commande..."></textarea>
    </div>

    <button type="submit">Envoyer la commande sur WhatsApp</button>
    <p class="status" id="status"></p>
  </form>
</main>

<footer>F Tech Design — Qualité avant tout</footer>

<script>
  // Numéro WhatsApp pro, format international sans + ni espaces
  const WHATSAPP_NUMBER = "229 51224992";

  const form = document.getElementById('orderForm');
  const statusEl = document.getElementById('status');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    statusEl.textContent = '';

    const nom = document.getElementById('nom').value.trim();
    const tel = document.getElementById('tel').value.trim();
    const produit = document.getElementById('produit').value;
    const adresse = document.getElementById('adresse').value.trim();
    const message = document.getElementById('message').value.trim();

    let valid = true;

    const nomField = document.getElementById('field-nom');
    const telField = document.getElementById('field-tel');

    if(!nom){
      nomField.classList.add('invalid');
      valid = false;
    } else {
      nomField.classList.remove('invalid');
    }

    if(!tel){
      telField.classList.add('invalid');
      valid = false;
    } else {
      telField.classList.remove('invalid');
    }

    if(!valid){
      statusEl.textContent = "Merci de compléter les champs obligatoires.";
      return;
    }

    let texte = "Bonjour, je souhaite passer une commande :\n\n";
    texte += "Nom : " + nom + "\n";
    texte += "Téléphone : " + tel + "\n";
    texte += "Produit souhaité : " + produit + "\n";
    if(adresse) texte += "Adresse de livraison : " + adresse + "\n";
    if(message) texte += "Message : " + message + "\n";

    const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(texte);

    statusEl.textContent = "Redirection vers WhatsApp...";

    // window.location fonctionne mieux que window.open sur mobile (évite les bloqueurs de pop-up)
    window.location.href = url;
  });
</script>

</body>
</html>
